# dsh-superagent-cn 的 bundle 层：无配置地插入各插件，以及其 Session 运行所用的代理 preset。
# profile 提供 `dsh-superagent-cn` 条目的 stateDir（见 docs/006-deployment.md 与 examples/profile.cordis.patch.yml）；
# 没有 stateDir 时插件拒绝启动。
- insert:
    - id: dsh-superagent-cn
      name: dsh-superagent-cn
    - id: dsh-superagent-cn-github
      name: dsh-superagent-cn/github-watch
    # 可选的飞书 Source；启用后需配置机器人 CLI。
    - id: dsh-superagent-cn-feishu
      name: dsh-superagent-cn/feishu-watch
      disabled: true
    # 每个执行器 Session 运行所用的代理 preset（src/app/sessions.ts 中的 WORKER_PRESET）；主 Session 用下面自己的。
    # 它是 DSH 的 `standard` preset，只保留执行器需要的能力，其 shell 会在前台命令运行 5 秒后把它转入后台任务，
    # 这样长命令不会卡住人的消息——Session 在下一步才取到该消息。省略的：向人提问、演示、计划模式、插件管理器
    # 与市场、调度、目标、工作流、网页抓取，以及会在本 preset 下运行的 fork 子代理；spawn 的子代理运行在
    # `standard` 下，其 shell 只在 60 秒后才把命令转入后台，因为子代理结束时其任务会被杀死。preset 行没有
    # 把它从 preset 选择器里隐藏的设置，所以它的名称和描述说明了面向谁。
    - id: dsh-superagent-cn-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-cn-worker
        name: dsh-superagent-cn 执行器
        description: dsh-superagent-cn 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工作所需的工具。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 前台命令最多等待 5 秒，之后 shell 工具把它转入后台任务。
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 等待任务也在 5 秒后结束；任务结束时以结果唤醒执行器。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  agentPreset: standard
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
    # 主 Session 运行所用的代理 preset（src/app/sessions.ts 中的 ROUTER_PRESET）。执行器的 5 秒 shell 与任务等待，
    # 使一个命令或一次等待不会卡住后续候选；只保留主 Session 用到的：没有子代理、网页、文件搜索或写入、待办清单、
    # 向人提问、演示、计划模式、插件管理器、调度、目标或工作流。没有 persona：主 Session 的提示词是完整的，
    # 不需要其他部分。
    - id: dsh-superagent-cn-router-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-cn-router
        name: dsh-superagent-cn 主 Session
        description: dsh-superagent-cn 的主 Session 专用，不供手动选择。前台命令和任务等待超 5 秒转入后台，只含路由所需的工具。
        order: 91
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
