# profile 配置示例（$DSH_HOME/profiles/<profile>/cordis.patch.yml）。
# 首次启动前替换 <占位符>；见 docs/006-deployment.md。
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent-cn
  config:
    stateDir: <绝对路径，例如 /home/me/.dsh/state/superagent>
# 飞书是可选的：取消注释以启用其 Source，然后在 Feishu Source 上设置机器人的 lark-cli。
# - id: dsh-superagent-cn-feishu
#   disabled: false
